<!doctype html>
<html lang="pt-BR">
  <meta charset="utf-8" /><title>Kaia · SR personalizado</title>
  <style>
    * {
      box-sizing: border-box;
    }
    html,
    body {
      margin: 0;
      background: transparent;
      color: var(--text, #fff);
      font-family: var(--font, Segoe UI), sans-serif;
    }
    #box {
      width: var(--width, 520px);
      padding: var(--padding, 20px);
      border-radius: var(--radius, 20px);
      background: var(--bg, rgba(16, 22, 41, 0.85));
      border: 1px solid var(--accent, #4ae8ff);
      overflow: hidden;
    }
    .lab {
      font-size: 11px;
      letter-spacing: 0.2em;
      color: var(--accent);
      font-weight: 800;
    }
    .tit {
      font-size: var(--title-size, 22px);
      font-weight: 750;
      margin: 8px 0;
      overflow-wrap: anywhere;
    }
    .who {
      font-size: 13px;
      opacity: 0.75;
    }
    .bar {
      height: 5px;
      background: #ffffff22;
      margin: 14px 0 8px;
      border-radius: 10px;
      overflow: hidden;
    }
    .fill {
      height: 100%;
      background: var(--accent);
      transition: width 0.8s linear;
    }
    .t {
      font-size: 12px;
      font-variant-numeric: tabular-nums;
      opacity: 0.8;
    }
    body[data-theme='neon'] #box {
      box-shadow: inset 0 0 25px #4ae8ff10;
      border-left: 5px solid var(--accent);
    }
    body[data-theme='minimal'] #box {
      border: 0;
      border-left: 3px solid var(--accent);
    }
    body[data-theme='glass'] #box {
      backdrop-filter: blur(12px);
      border-color: #ffffff55;
      box-shadow: 0 8px 25px #0003;
    }
    body[data-theme='retro'] #box {
      border: 3px solid var(--accent);
      border-radius: 0;
      font-family: Consolas, monospace;
      box-shadow: 5px 5px 0 #000;
    }
    body[data-theme='broadcast'] #box {
      border: 0;
      border-top: 6px solid var(--accent);
      box-shadow: 0 5px 25px #0005;
    }
    .hide-who #who,
    .hide-time #tempo,
    .hide-bar .bar {
      display: none;
    }</style
  ><style id="custom-css"></style>
  <div id="box">
    <div class="lab" id="lab">SONG REQUEST</div>
    <div class="tit" id="tit">Carregando…</div>
    <div class="who" id="who"></div>
    <div class="bar"><div class="fill" id="fill"></div></div>
    <div class="t" id="tempo">--:--</div>
  </div>
  <script src="sr-layout.js"></script>
  <script src="sr-rgb.js"></script>
  <script src="sr-spectrum.js"></script>
  <script src="sr.js"></script>
</html>
