<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Kaia SR</title>

    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: transparent;
        font-family:
          Segoe UI,
          sans-serif;
        color: #fff;
      }

      #box {
        padding: 14px 18px;
        background: rgba(8, 8, 14, 0.72);
        border-radius: 14px;
        min-width: 280px;
        max-width: 460px;
      }

      .lab {
        font-size: 11px;
        letter-spacing: 0.14em;
        color: #ff3d9a;
        font-weight: 700;
      }

      .tit {
        font-size: 18px;
        font-weight: 700;
        margin: 4px 0;
      }

      .who {
        font-size: 12px;
        color: #9aa0b0;
      }

      .bar {
        height: 6px;
        background: #222;
        border-radius: 99px;
        margin: 10px 0 6px;
        overflow: hidden;
      }

      .fill {
        height: 100%;
        background: #ff3d9a;
        width: 0%;
        transition: width 0.25s linear;
      }

      .t {
        font-size: 12px;
        color: #6dffc0;
      }

      .erro {
        color: #ff7777;
      }
    </style>
  </head>

  <body>
    <div id="box">
      <div class="lab" id="lab">SONG REQUEST</div>

      <div class="tit" id="tit">carregando...</div>

      <div class="who" id="who"></div>

      <div class="bar">
        <div class="fill" id="fill"></div>
      </div>

      <div class="t" id="tempo">--:--</div>
    </div>

    <script src="sr.js"></script>
  </body>
</html>
